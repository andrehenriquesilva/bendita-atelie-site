<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#4A9B9F; --teal-dark:#14323B; --navy:#0E1E24;
    --sun:#F2B705; --wpp:#20BD5A; --ink:#0E1E24;
    --font-display:'Playfair Display',serif; --font-base:'Montserrat',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#07151a;display:flex;justify-content:center;align-items:center}
  .post{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:var(--font-base)}
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* véus para legibilidade */
  .vtop{position:absolute;top:0;left:0;right:0;height:30%;
        background:linear-gradient(180deg,rgba(14,30,36,.92),rgba(14,30,36,0))}
  .vbot{position:absolute;bottom:0;left:0;right:0;height:30%;
        background:linear-gradient(0deg,rgba(14,30,36,.85),rgba(14,30,36,0))}
  /* logo topo */
  .logo{position:absolute;top:54px;left:50%;transform:translateX(-50%);width:300px;z-index:5}
  .logo img{width:100%;filter:drop-shadow(0 4px 14px rgba(0,0,0,.55))}
  /* título em pill teal */
  .titlewrap{position:absolute;top:330px;left:60px;right:60px;z-index:4;text-align:center}
  .titlecard{display:inline-block;background:rgba(20,50,59,.82);backdrop-filter:blur(3px);
    border:1.5px solid rgba(242,183,5,.55);border-radius:30px;padding:30px 50px 26px;
    box-shadow:0 16px 40px rgba(0,0,0,.4)}
  .titlecard .destino{font-family:var(--font-display);font-weight:900;color:#fff;
    font-size:88px;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.5)}
  .titlecard .datas{display:inline-block;margin-top:18px;background:var(--sun);color:var(--ink);
    font-weight:800;font-size:34px;letter-spacing:1px;padding:10px 30px;border-radius:999px}
  /* card de inclusões flutuante */
  .card{position:absolute;left:70px;right:70px;bottom:250px;z-index:4;
    background:rgba(20,50,59,.86);backdrop-filter:blur(5px);
    border:1px solid rgba(255,255,255,.14);border-radius:34px;padding:46px 52px 40px;
    box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .incl{list-style:none;display:flex;flex-direction:column;gap:24px;margin-bottom:30px}
  .incl li{display:flex;align-items:center;gap:22px;color:#fff;font-size:38px;font-weight:600;line-height:1.2}
  .incl .ic{flex:0 0 auto;width:62px;height:62px;border-radius:16px;background:rgba(74,155,159,.30);
    border:1px solid rgba(242,183,5,.55);display:flex;align-items:center;justify-content:center}
  .incl .ic svg{width:40px;height:40px;fill:var(--sun)}
  .incl li b{font-weight:800}
  .sep{height:1px;background:rgba(255,255,255,.18);margin:0 0 26px}
  /* preço */
  .pricerow{display:flex;align-items:center;gap:18px;justify-content:center;margin-bottom:6px}
  .pricerow .x{font-size:46px;font-weight:800;color:#fff}
  .pricerow .v{font-family:var(--font-display);font-weight:900;color:var(--sun);
    font-size:128px;line-height:.9;text-shadow:0 4px 16px rgba(0,0,0,.45)}
  .pricerow .v small{font-size:60px;font-family:var(--font-base);font-weight:800}
  .pricerow .v .cur{font-family:var(--font-base);font-weight:800;font-size:56px;vertical-align:super;margin-right:8px;letter-spacing:0}
  .pretitle{text-align:center;color:var(--teal);font-weight:800;font-size:30px;
    letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
  .obs{text-align:center;color:#dfecec;font-size:28px;font-weight:600;margin-top:6px}
  .obs b{color:var(--sun)}
  /* CTA whatsapp */
  .cta{position:absolute;left:70px;right:70px;bottom:90px;z-index:4;
    display:flex;align-items:center;justify-content:center;gap:18px;
    background:var(--wpp);color:#fff;font-weight:800;font-size:44px;
    border-radius:24px;padding:30px;box-shadow:0 14px 34px rgba(32,189,90,.5)}
  .cta svg{width:50px;height:50px;fill:#fff}
</style>
</head>
<body>
  <div class="post">
    <img class="photo" id="foto">
    <div class="vtop"></div><div class="vbot"></div>
    <div class="logo"><img id="logo"></div>

    <div class="titlewrap">
      <div class="titlecard">
        <div class="destino" id="destino"></div>
        <div class="datas" id="datas"></div>
      </div>
    </div>

    <div class="card">
      <ul class="incl" id="incl"></ul>
      <div class="sep"></div>
      <div class="pretitle" id="pretitle"></div>
      <div class="pricerow"><span class="x" id="parc"></span><span class="v" id="valor"></span></div>
      <div class="obs" id="obs"></div>
    </div>

    <div class="cta" id="cta"></div>
  </div>
  <script src="dados.js"></script>

    if (P.fotoPos) document.getElementById('foto').style.objectPosition = P.fotoPos;
    document.getElementById('logo').src = root + '/marca/identidade-oficial/logotipos/png-transparente/principal-branco.png';

    document.getElementById('datas').textContent = P.datas;

</body>
</html>
