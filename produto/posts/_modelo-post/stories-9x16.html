<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Bendita Tour — modelo de post · stories/reels 9:16</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../marca/marca.css">
<style>
  html,body{background:#07151a;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px}

  /* STORIES / REELS / STATUS / TIKTOK — 1080 x 1920 */
  .post{position:relative;width:1080px;height:1920px;overflow:hidden}

  .post .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:1;
    background:linear-gradient(160deg,var(--teal) 0%,var(--teal-dark) 50%,var(--sunset) 115%)}

  /* margem de segurança UI do app (topo/baixo) */
  .headline{position:absolute;top:200px;left:80px;right:80px;z-index:3;text-align:center;color:var(--paper)}
  .headline .eyebrow{margin-bottom:24px}
  .headline .destino{font-family:var(--font-display);font-weight:900;font-size:150px;line-height:.9;
    text-shadow:0 8px 28px rgba(0,0,0,.55)}
  .headline .sub{font-weight:700;font-size:34px;letter-spacing:1px;margin-top:22px;color:var(--teal-light)}

  .footer{position:absolute;left:80px;right:80px;bottom:230px;z-index:3;text-align:center}
  .footer .price small{display:block;font-weight:700;font-size:24px;color:var(--paper);opacity:.9;margin-bottom:10px}
  .footer .price-chip{font-size:64px;margin-bottom:34px}.footer .price-chip small{font-size:28px;opacity:.7}
  .footer .cta-wpp{font-size:28px}
  .brand{position:absolute;left:50%;transform:translateX(-50%);top:90px;z-index:4;width:120px;height:120px;border-radius:50%;
    border:2px solid var(--sun);overflow:hidden;background:#fff;box-shadow:0 10px 26px rgba(0,0,0,.45)}
  .brand img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
  <div class="post">
    <img class="photo" src="assets/destino.jpg" alt="">
    <div class="veil-top"></div>
    <div class="veil-bottom"></div>

    <div class="brand"><img src="../../../marca/assets/ICONE.webp" alt="Bendita Tour"></div>

    <div class="headline">
      <span class="eyebrow">Bendita Tour</span>
      <div class="destino">CANCÚN</div>
      <div class="sub">7 noites · all inclusive<br>aéreo incluso</div>
    </div>

    <div class="footer">
      <div class="price">
        <small>a partir de</small>
        <span class="price-chip"><small>12x</small> R$ 389</span>
      </div>
      <span class="cta-wpp">Arrasta pra cima · WhatsApp</span>
    </div>
  </div>
</body>
</html>
