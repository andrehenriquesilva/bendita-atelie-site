<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Bendita Tour — modelo de reel · 9:16 animado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../marca/marca.css">
<style>
  /* Cena base do reel (1080x1920). O export-video.py avança as animações frame a frame.
     Toda animação deve usar @keyframes (a Web Animations API é controlada pelo script). */
  html,body{background:#07151a;display:flex;justify-content:center;align-items:center;min-height:100vh}
  .post{position:relative;width:1080px;height:1920px;overflow:hidden;background:#07151a}

  /* Foto pura com leve Ken Burns (zoom lento) */
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;
    background:linear-gradient(160deg,var(--teal) 0%,var(--teal-dark) 50%,var(--sunset) 115%);
    animation:kenburns 6s ease-out forwards}
  @keyframes kenburns{from{transform:scale(1.0)}to{transform:scale(1.12)}}

  .headline{position:absolute;top:240px;left:80px;right:80px;z-index:3;text-align:center;color:var(--paper)}
  .eyebrow{margin-bottom:24px;opacity:0;animation:fadeUp .8s ease-out .3s forwards}
  .destino{font-family:var(--font-display);font-weight:900;font-size:150px;line-height:.9;
    text-shadow:0 8px 28px rgba(0,0,0,.55);opacity:0;animation:fadeUp 1s ease-out .8s forwards}
  .sub{font-weight:700;font-size:34px;margin-top:22px;color:var(--teal-light);opacity:0;animation:fadeUp 1s ease-out 1.4s forwards}

  .footer{position:absolute;left:80px;right:80px;bottom:260px;z-index:3;text-align:center;opacity:0;animation:fadeUp 1s ease-out 2.2s forwards}
  .price-chip{font-size:64px;margin-bottom:34px}.price-chip small{font-size:28px;opacity:.7}
  .cta-wpp{font-size:28px}

  @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}

  .brand{position:absolute;left:50%;transform:translateX(-50%);top:100px;z-index:4;width:120px;height:120px;border-radius:50%;
    border:2px solid var(--sun);overflow:hidden;background:#fff}
  .brand img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
  <div class="post">
    <img class="photo" src="assets/destino.jpg" alt="">
    <div class="veil-top"></div>
    <div class="veil-bottom"></div>
    <div class="brand"><img src="../../../marca/assets/ICONE.webp" alt="Bendita Tour"></div>

    <div class="headline">
      <span class="eyebrow">Bendita Tour</span>
      <div class="destino">CANCÚN</div>
      <div class="sub">7 noites · all inclusive · aéreo incluso</div>
    </div>

    <div class="footer">
      <span class="price-chip"><small>12x</small> R$ 389</span><br>
      <span class="cta-wpp">Garanta no WhatsApp</span>
    </div>
  </div>
</body>
</html>
