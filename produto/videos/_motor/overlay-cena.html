<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../marca/marca.css">
<style>
  html,body{background:transparent;margin:0}
  .ov{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:var(--font-base)}
  .vt{position:absolute;top:0;left:0;right:0;height:42%;
      background:linear-gradient(180deg,rgba(14,30,36,.80),rgba(14,30,36,.20) 70%,rgba(14,30,36,0))}
  .logo{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:300px}
  .logo img{width:100%;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
  .wrap{position:absolute;top:280px;left:70px;right:70px;text-align:center;color:#fff}
  /* HOOK: grande, Playfair */
  .hook{font-family:var(--font-display);font-weight:900;font-size:104px;line-height:1.0;
      text-shadow:0 6px 26px rgba(0,0,0,.6)}
  .hook .em{color:var(--sun)}
  /* LEGENDA de benefício: chip + texto */
  .leg{display:inline-flex;align-items:center;gap:18px;background:rgba(74,155,159,.92);
      padding:22px 38px;border-radius:999px;font-weight:800;font-size:46px;
      box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .leg .ic{font-size:50px}
  /* HOTÉIS: título + lista de opções (chips) */
  .htit2{font-weight:800;font-size:32px;letter-spacing:4px;text-transform:uppercase;color:var(--sun);
      margin-bottom:26px;text-shadow:0 4px 18px rgba(0,0,0,.6)}
  .hl{display:flex;flex-direction:column;gap:16px;align-items:center}
  .hli{display:inline-block;background:rgba(74,155,159,.94);color:#fff;font-weight:800;font-size:40px;
      padding:16px 36px;border-radius:999px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
  .hl2{display:flex;flex-direction:column;gap:16px}
  .hrow2{display:flex;align-items:center;justify-content:space-between;gap:18px;background:rgba(74,155,159,.94);
      padding:16px 30px;border-radius:20px;box-shadow:0 8px 22px rgba(0,0,0,.45)}
  .hrow2 .hn2{font-weight:800;font-size:31px;color:#fff;text-align:left;line-height:1.1}
  .hrow2 .hp2{font-weight:900;font-size:36px;color:var(--sun);white-space:nowrap}
  .hrow2 .hp2 small{font-size:21px;color:#fff;opacity:.85;font-weight:700}
  /* OFERTA: bloco inferior dinâmico (preço + CTA) */
  .vb{position:absolute;bottom:0;left:0;right:0;height:54%;
      background:linear-gradient(0deg,rgba(14,30,36,.95) 4%,rgba(14,30,36,.6) 45%,rgba(14,30,36,0))}
  .oferta{position:absolute;left:70px;right:70px;bottom:150px;text-align:center;color:#fff}
  .oferta .pre{font-size:34px;font-weight:700;color:var(--teal-light);margin-bottom:14px}
  .oferta .chip{display:inline-flex;align-items:baseline;gap:12px;background:var(--sun);color:var(--ink);
      font-weight:900;border-radius:22px;padding:18px 46px;font-size:104px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .oferta .chip small{font-size:44px}
  .oferta .obs{font-size:34px;font-weight:700;margin:18px 0 32px}.oferta .obs b{color:var(--sun)}
  .oferta .cta{display:inline-flex;align-items:center;gap:18px;background:var(--wpp);color:#fff;
      font-weight:800;font-size:46px;border-radius:22px;padding:26px 54px;box-shadow:0 14px 34px rgba(32,189,90,.5)}
  .oferta .cta svg{width:52px;height:52px;fill:#fff}
</style>
</head>
<body>
  <div class="ov">
    <div class="vt"></div>
    <div class="logo"><img src="../../../marca/identidade-oficial/logotipos/png-transparente/principal-branco.png"></div>
    <div class="wrap" id="wrap"></div>
  </div>
  <script>
    const d = JSON.parse(decodeURIComponent(location.hash.slice(1) || '%7B%7D'));
    const w = document.getElementById('wrap');
    const WPP = `<svg viewBox="0 0 24 24"><path d="M19.05 4.91A9.82 9.82 0 0 0 12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.004c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.02zM12.04 20.13h-.003a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23a8.2 8.2 0 0 1 5.82 2.42 8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.7 8.23-8.24 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.12-.15.16-.25.25-.42.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43-.14 0-.31-.01-.48-.01a.92.92 0 0 0-.67.31c-.23.25-.88.86-.88 2.1 0 1.24.9 2.43 1.03 2.6.13.17 1.77 2.71 4.3 3.8.6.26 1.07.41 1.43.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z"/></svg>`;
    if (d.tipo === 'hook') {
      w.innerHTML = `<div class="hook">${d.txt}</div>`;
    } else if (d.tipo === 'hoteis') {
      const obj = d.itens && typeof d.itens[0] === 'object';
      const rows = (d.itens||[]).map(h => typeof h === 'string'
        ? `<div class="hli">${h}</div>`
        : `<div class="hrow2"><span class="hn2">${h.nome}</span><span class="hp2">${h.parc||''} ${h.valor||''}${h.taxa?` <small>+taxa ${h.taxa}</small>`:''}</span></div>`).join('');
      w.innerHTML = `<div class="htit2">${d.titulo||'Escolha seu hotel'}</div><div class="${obj?'hl2':'hl'}">${rows}</div>`;
    } else if (d.tipo === 'oferta') {
      w.remove();
      document.querySelector('.ov').insertAdjacentHTML('beforeend',
        `<div class="vb"></div><div class="oferta"><div class="pre">${d.pre||'por pessoa, a partir de'}</div>`+
        `<div><span class="chip"><small>${d.parc||''}</small> ${d.valor||''}</span></div>`+
        `<div class="obs">${d.obs||''}</div><div class="cta">${WPP}<span>${d.cta||'Chame no WhatsApp'}</span></div></div>`);
    } else {
      w.innerHTML = `<div class="leg"><span class="ic">${d.ic||''}</span><span>${d.txt}</span></div>`;
    }
  </script>
</body>
</html>
